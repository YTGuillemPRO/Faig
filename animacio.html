<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Terra: rotació i translació — El Nostre Univers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Space Grotesk',sans-serif;background:#02030a;color:#e8ecf4}
  #escena{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
  #escena.arrossegant{cursor:grabbing}

  #barra{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;
    padding:12px 18px;background:rgba(4,6,12,.72);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,255,255,.07)}
  #barra a.tornar{color:#9aa5b5;text-decoration:none;font-size:.88rem;white-space:nowrap;
    padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);transition:all .3s}
  #barra a.tornar:hover{color:#fde68a;border-color:rgba(252,211,77,.5)}
  #barra strong{color:#fde68a;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:560px){#barra strong{display:none}}

  #moviment{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:16;
    text-align:center;pointer-events:none;width:100%}
  #mov-text{
    display:inline-block;
    font-size:clamp(1.8rem,6vw,3.4rem);font-weight:700;letter-spacing:.14em;
    color:#f4f6fb;text-transform:uppercase;
    text-shadow:0 2px 24px rgba(0,0,0,.9);
    opacity:0;transition:opacity .8s;
  }
  #mov-text.visible{opacity:1}
</style>
</head>
<body>

<canvas id="escena"></canvas>

<div id="barra">
  <a class="tornar" href="index.html">← Tornar a la web</a>
  <strong>🌍 La Terra: rotació i translació</strong>
</div>

<div id="moviment"><span id="mov-text">Rotació</span></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* Si estem incrustats dins de la web (iframe), amaguem la barra superior */
if (window.self !== window.top){
  document.getElementById('barra').remove();
  document.getElementById('moviment').style.top = '18px';
}

/* ================== CONFIGURACIÓ ================== */
const REDUIT = matchMedia('(prefers-reduced-motion: reduce)').matches;
const CS = 0.5;
const ORBITA_R = 16;
const LLUNA_R = 5.6;
const INCLINACIO = 23.5;
const VEL_GIR    = Math.PI*2 / 2.5;   // 1 rotació cada 2,5 s
const VEL_ORBITA = Math.PI*2 / 24;    // 1 òrbita cada 24 s
const VEL_LLUNA  = Math.PI*2 / 3;

/* ================== ESCENA BÀSICA ================== */
const canvas = document.getElementById('escena');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const escena = new THREE.Scene();
escena.background = new THREE.Color(0x02030a);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);

escena.add(new THREE.AmbientLight(0x8899bb, 0.55));
const llumSol = new THREE.PointLight(0xfff1c9, 2.6, 0, 0);
escena.add(llumSol);

function creaEstrelles(n, mida, op){
  const pos = new Float32Array(n*3);
  for (let i=0;i<n;i++){
    const r = 90 + Math.random()*90;
    const t = Math.random()*Math.PI*2, p = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(p)*Math.cos(t);
    pos[i*3+1] = r*Math.cos(p);
    pos[i*3+2] = r*Math.sin(p)*Math.sin(t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  return new THREE.Points(g, new THREE.PointsMaterial({
    color:0xffffff, size:mida, sizeAttenuation:true, transparent:true, opacity:op
  }));
}
const estrelles1 = creaEstrelles(1200, 0.28, 0.9);
const estrelles2 = creaEstrelles(500, 0.5, 0.55);
escena.add(estrelles1, estrelles2);

/* ================== VÒXELS (peces LEGO) ================== */
function hash(x,y){ const s = Math.sin(x*127.1 + y*311.7)*43758.5453; return s - Math.floor(s); }
function soroll(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){ return 0.6*soroll(x,y)+0.3*soroll(x*2,y*2)+0.1*soroll(x*4,y*4); }

const CONTINENTS = [
  [55,83,-60,-20], [15,72,-168,-52], [-56,13,-82,-34], [36,71,-10,60],
  [-35,37,-17,51], [5,75,60,180], [60,72,-180,-168], [-39,-11,113,153],
];
function esTerra(lat, lon){
  if (lat < -66) return true;
  for (const [la1,la2,lo1,lo2] of CONTINENTS)
    if (lat>=la1 && lat<=la2 && lon>=lo1 && lon<=lo2)
      return fbm(lat*0.14+7.3, lon*0.14+2.1) > 0.32;
  return false;
}
function colorVoxel(lat, lon, r){
  const j = 0.92 + hash(r, r*1.7)*0.16;
  if (esTerra(lat, lon)){
    if (Math.abs(lat) > 64) return [0.93*j, 0.95*j, 0.98*j];
    if (Math.abs(lat) > 12 && Math.abs(lat) < 32 && fbm(lon*0.2,lat*0.2) > 0.5)
      return [0.85*j, 0.70*j, 0.42*j];
    const g = 0.32 + soroll(r,3.3)*0.14;
    return [0.22*j, g*j, 0.16*j];
  }
  const eq = Math.cos(lat*Math.PI/180);
  return [0.06*j, 0.18*j + eq*0.10, 0.45*j + eq*0.14];
}

function esferaVoxels(R){
  const out = [];
  for (let x=-R; x<=R; x++)
    for (let y=-R; y<=R; y++)
      for (let z=-R; z<=R; z++)
        if (x*x+y*y+z*z <= R*R + 0.4){
          const r = Math.sqrt(x*x+y*y+z*z) || 1;
          out.push({
            x, y, z,
            lat: Math.asin(y/r)*180/Math.PI,
            lon: Math.atan2(x, z)*180/Math.PI
          });
        }
  return out;
}

/* ================== SISTEMA: SOL + TERRA + LLUNA ================== */
const pivOrbita = new THREE.Group(); escena.add(pivOrbita);
const anchorTerra = new THREE.Group();
anchorTerra.position.x = ORBITA_R;
pivOrbita.add(anchorTerra);

const inclinacio = new THREE.Group();
inclinacio.rotation.z = THREE.MathUtils.degToRad(INCLINACIO);
anchorTerra.add(inclinacio);

const girTerra = new THREE.Group();
inclinacio.add(girTerra);

const pivLluna = new THREE.Group();
anchorTerra.add(pivLluna);

const geoPeça = new THREE.BoxGeometry(CS*0.92, CS*0.92, CS*0.92);

function creaSistema(vox, material){
  const mesh = new THREE.InstancedMesh(geoPeça, material, vox.length);
  const M = new THREE.Matrix4();
  vox.forEach((v,i)=>{
    M.makeScale(0,0,0);
    M.setPosition(v.x*CS, v.y*CS, v.z*CS);
    mesh.setMatrixAt(i, M);
  });
  mesh.instanceMatrix.needsUpdate = true;
  return mesh;
}

/* SOL */
const voxSol = esferaVoxels(8);
const matSol = new THREE.MeshLambertMaterial({ color:0xffffff, emissive:0xff8c1a, emissiveIntensity:0.85 });
const solMesh = creaSistema(voxSol, matSol);
escena.add(solMesh);
voxSol.forEach((v,i)=>{
  const t = hash(i, i*2.3);
  solMesh.setColorAt(i, new THREE.Color(1, 0.55+t*0.35, 0.1+t*0.25));
});
solMesh.instanceColor.needsUpdate = true;

/* resplendor del sol */
const cvGlow = document.createElement('canvas'); cvGlow.width = cvGlow.height = 256;
const g2 = cvGlow.getContext('2d');
const grad = g2.createRadialGradient(128,128,10,128,128,128);
grad.addColorStop(0,'rgba(255,190,80,.85)'); grad.addColorStop(.4,'rgba(255,140,40,.25)');
grad.addColorStop(1,'rgba(255,120,20,0)');
g2.fillStyle = grad; g2.fillRect(0,0,256,256);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map:new THREE.CanvasTexture(cvGlow), blending:THREE.AdditiveBlending, depthWrite:false, transparent:true
}));
glow.scale.setScalar(13); escena.add(glow);

/* TERRA */
const voxTerra = esferaVoxels(6.4);
const matTerra = new THREE.MeshLambertMaterial({ color:0xffffff });
const terraMesh = creaSistema(voxTerra, matTerra);
girTerra.add(terraMesh);
const colorsTerra = [];
voxTerra.forEach((v,i)=>{
  const c = colorVoxel(v.lat, v.lon, i);
  colorsTerra.push(c);
  terraMesh.setColorAt(i, new THREE.Color(...c));
});
terraMesh.instanceColor.needsUpdate = true;

/* LLUNA */
const voxLluna = esferaVoxels(2);
const matLluna = new THREE.MeshLambertMaterial({ color:0xffffff });
const llunaMesh = creaSistema(voxLluna, matLluna);
const anchorLluna = new THREE.Group();
anchorLluna.position.x = LLUNA_R;
pivLluna.add(anchorLluna);
anchorLluna.add(llunaMesh);
voxLluna.forEach((v,i)=>{
  const t = 0.55 + hash(i,9.1)*0.3;
  llunaMesh.setColorAt(i, new THREE.Color(t,t,t*1.02));
});
llunaMesh.instanceColor.needsUpdate = true;

/* ---------- ANELLES, EIX I INDICADORS ---------- */
function anella(radi, color){
  const pts = [];
  for (let i=0;i<=96;i++){ const a=i/96*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*radi,0,Math.sin(a)*radi)); }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent:true, opacity:0 }));
}
const anellaOrbita = anella(ORBITA_R, 0xfcd34d);  escena.add(anellaOrbita);
const anellaLluna  = anella(LLUNA_R, 0xaab4c4);   anchorTerra.add(anellaLluna);

const matriuEix = new THREE.MeshBasicMaterial({ color:0xfcd34d, transparent:true, opacity:0.5 });
const eix = new THREE.Group();
const alt = 6.4*CS*2 + 2.6;
const vareta = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,alt,8), matriuEix);
const conus1 = new THREE.Mesh(new THREE.ConeGeometry(0.16,0.5,10), matriuEix);
const conus2 = conus1.clone();
conus1.position.y =  alt/2 + 0.2;
conus2.position.y = -alt/2 - 0.2; conus2.rotation.x = Math.PI;
eix.add(vareta, conus1, conus2);
inclinacio.add(eix);

/* anell equatorial puntejat + boletes que giren amb la Terra */
const eqPts = [];
for (let i=0;i<=72;i++){ const a=i/72*Math.PI*2; eqPts.push(new THREE.Vector3(Math.cos(a)*4,0,Math.sin(a)*4)); }
const eqLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(eqPts),
  new THREE.LineDashedMaterial({ color:0xfcd34d, dashSize:0.32, gapSize:0.26, transparent:true, opacity:0.45 })
);
eqLine.computeLineDistances();
girTerra.add(eqLine);
const geoBola = new THREE.BoxGeometry(0.24,0.24,0.24);
const matBola = new THREE.MeshBasicMaterial({ color:0xfde68a });
[0, 2.1, 4.2].forEach(a=>{
  const b = new THREE.Mesh(geoBola, matBola);
  b.position.set(Math.cos(a)*4, 0, Math.sin(a)*4);
  girTerra.add(b);
});

/* fletxa de direcció de l'òrbita (invisible fins a la translació) */
const fletxa = new THREE.Mesh(
  new THREE.ConeGeometry(0.3, 0.8, 10),
  new THREE.MeshBasicMaterial({ color:0xfcd34d, transparent:true, opacity:0 })
);
fletxa.rotation.x = -Math.PI/2;
fletxa.position.set(0, 0, -2.6);
anchorTerra.add(fletxa);

/* ================== ASSEMBLATGE LEGO (automàtic, silenciós) ================== */
const easeOutCubic = k => 1 - Math.pow(1-k, 3);
const easeOutBack  = k => { const c=1.7; return 1 + (c+1)*Math.pow(k-1,3) + c*Math.pow(k-1,2); };

const sistemes = [
  { mesh: solMesh,   vox: voxSol,   inici: 0.15 },
  { mesh: terraMesh, vox: voxTerra, inici: 0.8  },
  { mesh: llunaMesh, vox: voxLluna, inici: 3.0  },
];
const DUR = 1.25, TOTAL_ASM = 6.0;   // 6 s: suficient perquè TOTES les peces arribin
const dades = [];
sistemes.forEach(s=>{
  let minY=1e9, maxY=-1e9;
  s.vox.forEach(v=>{ minY=Math.min(minY,v.y); maxY=Math.max(maxY,v.y); });
  s.vox.forEach((v,i)=>{
    const dir = new THREE.Vector3().randomDirection();
    dades.push({
      s, i,
      inici: s.inici + ((v.y-minY)/(maxY-minY))*1.15 + Math.random()*0.35,
      objectiu: new THREE.Vector3(v.x*CS, v.y*CS, v.z*CS),
      sortida: dir.multiplyScalar(15 + Math.random()*18),
      eix: new THREE.Vector3().randomDirection(),
      fet: false
    });
  });
});
let tAsm = 0, assemblant = !REDUIT;
const _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _sc = new THREE.Vector3();
const _off = new THREE.Vector3(), _M = new THREE.Matrix4(), _c = new THREE.Color();

function aplicaAssemblatge(kGlobal){
  const flash = [];
  for (const d of dades){
    let k = (kGlobal - d.inici) / DUR;
    k = Math.max(0, Math.min(1, k));
    if (k >= 1){ if (!d.fet){ d.fet = true; d.s.mesh.setMatrixAt(d.i, _M.identity().setPosition(d.objectiu)); } continue; }
    if (k <= 0){ d.s.mesh.setMatrixAt(d.i, _M.makeScale(0,0,0).setPosition(d.sortida)); continue; }

    _off.subVectors(d.sortida, d.objectiu);
    const a = (1-k)*1.4, ca = Math.cos(a), sa = Math.sin(a);
    const ox = _off.x*ca + _off.z*sa, oz = -_off.x*sa + _off.z*ca;
    _p.set(d.objectiu.x + ox, d.objectiu.y + _off.y, d.objectiu.z + oz);
    const s = Math.max(0.05, 0.35 + 0.65*easeOutBack(Math.min(1, k*1.12)));
    _q.setFromAxisAngle(d.eix, (1-k)*4);
    _sc.setScalar(s);
    d.s.mesh.setMatrixAt(d.i, _M.compose(_p, _q, _sc));

    if (d.s.vox === voxTerra && k < 0.3){
      const t = k/0.3;
      _c.setRGB(1,1,1).lerp(new THREE.Color(...colorsTerra[d.i]), t);
      flash.push([d, _c.clone()]);
    }
  }
  flash.forEach(([d,c])=> d.s.mesh.setColorAt(d.i, c));
  sistemes.forEach(s=>{ s.mesh.instanceMatrix.needsUpdate = true; if (flash.length) s.mesh.instanceColor.needsUpdate = true; });
}

/* ================== CÀMERA (opcional: arrossegar + zoom) ================== */
let camTheta = 0.35, camPhi = 1.12, camR = 52;
let introActiva = !REDUIT, introT = 0;
const lookAt = new THREE.Vector3(0, 0.4, 0);
function posaCamera(){
  camera.position.set(
    camR*Math.sin(camPhi)*Math.sin(camTheta),
    camR*Math.cos(camPhi),
    camR*Math.sin(camPhi)*Math.cos(camTheta)
  );
  camera.lookAt(lookAt);
}
const punters = new Map();
let pinch0 = 0;
canvas.addEventListener('pointerdown', e=>{
  punters.set(e.pointerId, {x:e.clientX, y:e.clientY});
  canvas.classList.add('arrossegant');
  introActiva = false;
  canvas.setPointerCapture(e.pointerId);
  if (punters.size === 2){
    const [a,b] = [...punters.values()];
    pinch0 = Math.hypot(a.x-b.x, a.y-b.y);
  }
});
canvas.addEventListener('pointermove', e=>{
  if (!punters.has(e.pointerId)) return;
  const p = punters.get(e.pointerId);
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (punters.size === 1){
    camTheta -= dx*0.005;
    camPhi = Math.max(0.15, Math.min(Math.PI-0.15, camPhi - dy*0.005));
  } else if (punters.size === 2){
    const [a,b] = [...punters.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if (pinch0) camR = Math.max(8, Math.min(90, camR * pinch0/d));
    pinch0 = d;
  }
});
const solta = e=>{ punters.delete(e.pointerId); canvas.classList.remove('arrossegant'); };
canvas.addEventListener('pointerup', solta);
canvas.addEventListener('pointercancel', solta);
canvas.addEventListener('wheel', e=>{
  e.preventDefault(); introActiva = false;
  camR = Math.max(8, Math.min(90, camR * (1 + e.deltaY*0.001)));
}, { passive:false });

/* ================== TEXT: Rotació → Translació (automàtic) ================== */
const movText = document.getElementById('mov-text');
let textVisible = false;
function mostraRotacio(){
  if (textVisible) return;
  textVisible = true;
  movText.classList.add('visible');
}
function canviaText(nou){
  movText.classList.remove('visible');
  setTimeout(()=>{
    movText.textContent = nou;
    movText.classList.add('visible');
  }, 500);
}

/* ================== ESTAT ================== */
let mode = 'construint';   // 'construint' → 'rotacio' → 'translacio'
let opOrbita = 0;

/* mode moviment reduït: tot ja al lloc, comença directament la rotació */
if (REDUIT){
  dades.forEach(d=>{ d.s.mesh.setMatrixAt(d.i, _M.identity().setPosition(d.objectiu)); });
  sistemes.forEach(s=>{ s.mesh.instanceMatrix.needsUpdate = true; });
  mode = 'rotacio';
  mostraRotacio();
}

/* ================== BUCLE PRINCIPAL ================== */
const rellotge = new THREE.Clock();

function anima(){
  requestAnimationFrame(anima);
  const dt = Math.min(rellotge.getDelta(), 0.05);

  /* aproximació de càmera a l'inici */
  if (introActiva){
    introT += dt;
    const k = Math.min(1, introT/4.5), e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    camR = 52 + (30-52)*e;
    camTheta = 0.35 + (0.85-0.35)*e;
    if (k >= 1) introActiva = false;
  }

  /* assemblatge automàtic */
  if (assemblant){
    tAsm += dt;
    aplicaAssemblatge(tAsm);
    if (tAsm > TOTAL_ASM){
      assemblant = false;
      mode = 'rotacio';
      mostraRotacio();
    }
  }

  /* moviments:
     rotació: sempre (també durant la translació, com a la realitat)
     translació: s'activa SOLA quan la Terra ha fet UNA volta completa */
  const dtM = assemblant ? 0 : dt;
  if (mode === 'rotacio' || mode === 'translacio'){
    girTerra.rotation.y += dtM * VEL_GIR;
  }
  if (mode === 'translacio'){
    pivOrbita.rotation.y += dtM * VEL_ORBITA;
    pivLluna.rotation.y  += dtM * VEL_LLUNA;
  }

  /* una volta entera = 2π → canvi automàtic a translació */
  if (mode === 'rotacio' && girTerra.rotation.y >= Math.PI*2){
    mode = 'translacio';
    canviaText('Translació');
  }

  /* aparició suau de l'òrbita */
  const objectiuOp = mode === 'translacio' ? 1 : 0;
  opOrbita += (objectiuOp - opOrbita) * Math.min(1, dt*2.5);
  anellaOrbita.material.opacity = opOrbita * 0.3;
  anellaLluna.material.opacity  = opOrbita * 0.18;
  fletxa.material.opacity       = opOrbita * 0.85;

  /* sol que respira */
  const t = performance.now()*0.001;
  solMesh.rotation.y += dt*0.15;
  const pols = 1 + Math.sin(t*2.2)*0.025;
  glow.scale.setScalar(13*pols);
  glow.material.opacity = 0.85 + Math.sin(t*2.2)*0.08;

  estrelles1.rotation.y += dt*0.004;
  estrelles2.rotation.y -= dt*0.003;

  posaCamera();
  renderer.render(escena, camera);
}
anima();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
