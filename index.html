<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Nostre Univers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Space Grotesk',sans-serif;
    background:#04060c;color:#e8ecf4;
    overflow-x:hidden;
  }
  #estrelles{position:fixed;inset:0;z-index:-3}
  .nebulosa{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(ellipse 700px 500px at 20% 15%, rgba(70,100,170,.08), transparent),
    radial-gradient(ellipse 600px 450px at 80% 85%, rgba(130,80,150,.06), transparent);
  }
  .vialactia{
    position:fixed;top:-15%;left:-15%;width:130%;height:75%;z-index:-2;
    background:linear-gradient(115deg, transparent 32%, rgba(190,205,255,.045) 46%,
      rgba(255,255,255,.03) 50%, rgba(190,205,255,.045) 54%, transparent 68%);
    transform:rotate(-14deg);filter:blur(28px);
  }

  /* ---------- CAPÇALERA ---------- */
  header{text-align:center;padding:80px 20px 60px}
  .sol-wrap{position:relative;width:150px;height:150px;margin:0 auto 42px}
  .sol-wrap canvas{width:100%;height:100%;display:block;position:relative;z-index:1;border-radius:50%}
  .corona{
    position:absolute;inset:-55%;z-index:0;border-radius:50%;
    background:radial-gradient(circle, rgba(255,150,50,.26) 0%, rgba(255,110,20,.09) 42%, transparent 68%);
    animation:pols 9s ease-in-out infinite;
  }
  @keyframes pols{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}

  h1{font-size:clamp(2rem,5.5vw,3.6rem);color:#f4f6fb;letter-spacing:.02em;margin-bottom:14px;font-weight:700}
  .subtitol{color:#9aa5b5;font-size:1.05rem;max-width:520px;margin:0 auto;line-height:1.65}
  .boto{
    display:inline-block;margin-top:36px;padding:13px 30px;border-radius:999px;
    color:#fcd34d;text-decoration:none;font-weight:500;font-size:.95rem;
    border:1px solid rgba(252,211,77,.35);background:rgba(252,211,77,.05);
    transition:background .3s, border-color .3s;
  }
  .boto:hover{background:rgba(252,211,77,.12);border-color:rgba(252,211,77,.55)}

  /* ---------- SECCIONS ---------- */
  .seccio{max-width:1080px;margin:0 auto;padding:70px 20px;text-align:center;
    opacity:0;transform:translateY(20px);transition:opacity .8s, transform .8s}
  .seccio.visible{opacity:1;transform:none}
  h2{font-size:clamp(1.5rem,3.5vw,2rem);margin-bottom:10px;color:#f4f6fb}
  .subtext{color:#9aa5b5;max-width:560px;margin:0 auto 40px;line-height:1.6}

  .reixeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
  .targeta{
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;overflow:hidden;transition:transform .3s, border-color .3s;text-align:left;
  }
  .targeta:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.18)}
  .targeta iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}
  .cos{padding:16px 18px}
  .cos h3{margin-bottom:6px;font-size:1.05rem;color:#e8ecf4}
  .cos p{color:#8b95a7;font-size:.92rem;line-height:1.55}

  /* ---------- GISCUS ---------- */
  .giscus-wrap{max-width:740px;margin:0 auto;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px}

  /* ---------- BOTÓ D'OPINIÓ (racó) ---------- */
  #btn-opinio{
    position:fixed;bottom:22px;right:22px;z-index:50;
    padding:12px 20px;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:.92rem;font-weight:500;color:#dfe5ee;
    background:rgba(14,17,26,.78);border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(8px);transition:color .3s, border-color .3s;
  }
  #btn-opinio:hover{color:#fde68a;border-color:rgba(252,211,77,.5)}
  @media(max-width:520px){#btn-opinio{bottom:16px;right:16px;font-size:.85rem;padding:11px 16px}}
</style>
</head>
<body>

<canvas id="estrelles"></canvas>
<div class="nebulosa"></div>
<div class="vialactia"></div>

<header>
  <div class="sol-wrap">
    <div class="corona"></div>
    <canvas id="sol"></canvas>
  </div>
  <h1>El Nostre Univers</h1>
  <p class="subtitol">Tots els vídeos del nostre projecte en un sol lloc. Mireu-los i deixa'ns la vostra opinió.</p>
  <a href="#videos" class="boto">Veure els vídeos ↓</a>
</header>

<section id="videos" class="seccio">
  <h2>Els nostres vídeos</h2>
  <p class="subtext">Fes clic a qualsevol vídeo per veure'l.</p>
  <div class="reixeta" id="galeria"></div>
</section>

<section id="opinio" class="seccio">
  <h2>Dóna'ns la teva opinió</h2>
  <p class="subtext">Què t'ha semblat el projecte? Deixa'ns un comentari aquí sota.</p>
  <div class="giscus-wrap">
    <!-- ⚙️ CONFIGURA GISCUS: canvia les línies marcades amb 👇 -->
    <script src="https://giscus.app/client.js"
      data-repo="EL-TEU-USUARI/EL-TEU-REPO"
      data-repo-id="PEGA_AQUI_EL_REPO_ID"
      data-category="General"
      data-category-id="PEGA_AQUI_EL_CATEGORY_ID"
      data-mapping="title"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="top"
      data-theme="transparent_dark"
      data-lang="ca"
      data-loading="lazy"
      crossorigin="anonymous"
      async>
    </script>
  </div>
</section>

<button id="btn-opinio">Dóna'ns la teva opinió</button>

<script>
  /* ---------- SOL REALISTA (granulació + limb darkening) ---------- */
  const sol = document.getElementById('sol');
  const sctx = sol.getContext('2d');
  const S = 140;
  sol.width = S; sol.height = S;

  const G = 96;
  const soroll = new Float32Array(G * G);
  for (let i = 0; i < G * G; i++) soroll[i] = Math.random();

  function val(x, y){
    x = ((x % G) + G) % G; y = ((y % G) + G) % G;
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
    const x2 = (xi+1)%G, y2 = (yi+1)%G;
    const a = soroll[yi*G+xi], b = soroll[yi*G+x2];
    const c = soroll[y2*G+xi], d = soroll[y2*G+x2];
    return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
  }
  function fbm(x, y){
    return 0.5*val(x,y) + 0.25*val(x*2,y*2) + 0.125*val(x*4,y*4) + 0.0625*val(x*8,y*8);
  }

  let ultim = 0;
  function pintaSol(t){
    const img = sctx.createImageData(S, S);
    const d = img.data;
    for (let y = 0; y < S; y++){
      const dy = (y - S/2) / (S/2);
      for (let x = 0; x < S; x++){
        const dx = (x - S/2) / (S/2);
        const r2 = dx*dx + dy*dy;
        const i = (y*S + x) * 4;
        if (r2 > 1){ d[i+3] = 0; continue; }
        const limb = Math.sqrt(1 - r2);          // enfosquiment de la vora
        const n = fbm(x/16 + t, y/16 + t*0.6);   // granulació que bull
        const br = Math.min(1, Math.pow(limb, 0.55) * (0.62 + 0.55*n));
        d[i]   = 255 * br;
        d[i+1] = 255 * Math.pow(br, 1.25);
        d[i+2] = 255 * Math.pow(br, 3.2);
        d[i+3] = 255;
      }
    }
    sctx.putImageData(img, 0, 0);
  }
  function bucleSol(ts){
    if (ts - ultim > 80){ ultim = ts; pintaSol(ts * 0.00006); }
    requestAnimationFrame(bucleSol);
  }
  requestAnimationFrame(bucleSol);

  /* ---------- ESTRELES (amb colors naturals) ---------- */
  const canvas = document.getElementById('estrelles');
  const ctx = canvas.getContext('2d');
  let cometes = [];

  function mida(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  mida(); addEventListener('resize', mida);

  const tonalitats = ['255,255,255','255,255,255','255,255,255','205,218,255','255,228,196'];
  const estrelles = [];
  for (let i = 0; i < 260; i++) {
    estrelles.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.2 + 0.25,
      fase: Math.random() * Math.PI * 2,
      vel: 0.004 + Math.random() * 0.012,
      color: tonalitats[Math.floor(Math.random() * tonalitats.length)]
    });
  }

  function anima(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const e of estrelles){
      e.fase += e.vel;
      const a = 0.2 + Math.abs(Math.sin(e.fase)) * 0.7;
      ctx.beginPath();
      ctx.arc(e.x * canvas.width, e.y * canvas.height, e.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${e.color},${a})`;
      ctx.fill();
    }
    for (let i = cometes.length - 1; i >= 0; i--){
      const c = cometes[i];
      c.x += c.vx; c.y += c.vy; c.vida -= 0.01;
      if (c.vida <= 0){ cometes.splice(i, 1); continue; }
      const g = ctx.createLinearGradient(c.x, c.y, c.x - c.vx*12, c.y - c.vy*12);
      g.addColorStop(0, `rgba(255,255,255,${c.vida * 0.85})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(c.x - c.vx*12, c.y - c.vy*12);
      ctx.stroke();
    }
    requestAnimationFrame(anima);
  }
  anima();

  setInterval(() => {
    if (cometes.length < 2){
      cometes.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height * 0.5,
        vx: 5 + Math.random() * 5,
        vy: 2 + Math.random() * 3,
        vida: 0.9
      });
    }
  }, 6500);

  /* ---------- VÍDEOS (edita aquesta llista per afegir-ne) ---------- */
  const videos = [
    { id: 'aqz-KE-bpKQ', titol: 'Títol del vídeo 1', desc: 'Descripció del primer vídeo del projecte.' },
    { id: 'aqz-KE-bpKQ', titol: 'Títol del vídeo 2', desc: 'Explica aquí què hi veuran els visitants.' },
    { id: 'aqz-KE-bpKQ', titol: 'Títol del vídeo 3', desc: 'Pots afegir tants vídeos com vulguis.' },
  ];

  const galeria = document.getElementById('galeria');
  videos.forEach(v => {
    const card = document.createElement('article');
    card.className = 'targeta';
    card.innerHTML = `
      <iframe src="https://www.youtube-nocookie.com/embed/${v.id}"
        title="${v.titol}" loading="lazy" allowfullscreen></iframe>
      <div class="cos"><h3>${v.titol}</h3><p>${v.desc}</p></div>`;
    galeria.appendChild(card);
  });

  /* ---------- ANIMACIÓ EN FER SCROLL ---------- */
  const obs = new IntersectionObserver(entrades => {
    entrades.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.seccio').forEach(s => obs.observe(s));

  /* ---------- BOTÓ D'OPINIÓ ---------- */
  document.getElementById('btn-opinio').onclick = () =>
    document.getElementById('opinio').scrollIntoView({ behavior: 'smooth' });
</script>

</body>
</html>
